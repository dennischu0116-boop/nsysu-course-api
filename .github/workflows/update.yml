name: Update current semester data

on:
  schedule:
    - cron: "0 1 * * *"  # 每天 UTC 01:00（台灣時間早上 09:00）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 numpy pillow
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Run daily update
        run: python scripts/update_current.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update current semester data ($(date -u +%Y-%m-%d))"
            git push
          fi
